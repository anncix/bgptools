# /etc/nginx/sites-available/bgp-tool.conf
# DN42 BGP Tool 反向代理配置示例（带 HTTPS + 基础安全头）
# 用法：
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/bgp-tool.conf
#   sudo ln -s /etc/nginx/sites-available/bgp-tool.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name lg.your-node.dn42;        # 替换为你的域名

    # 强制跳转 HTTPS（如已配置证书）
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lg.your-node.dn42;

    # 证书（可用 acme.sh / certbot 申请，或自签）
    ssl_certificate     /etc/ssl/certs/bgp-tool.crt;
    ssl_certificate_key /etc/ssl/private/bgp-tool.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 限制请求体大小
    client_max_body_size 1m;

    # 反代到 Flask/gunicorn
    location / {
        proxy_pass http://127.0.0.1:8421;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # 安全头
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # 可选：按 IP 白名单限制访问（仅 DN42 内网或指定 IP）
    # allow 172.20.0.0/14;
    # allow fd00::/8;
    # allow 你的公网IP;
    # deny  all;
}
